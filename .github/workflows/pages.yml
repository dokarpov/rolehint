name: Publish RoleHint website (manual Pages source)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify website files
        run: |
          test -s site/index.html
          test -s site/workspace.html
          test -s site/landing.css
          test -s site/workspace.js
          test -s site/product.json
      - name: Scan published website for secrets and internal release notes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          patterns = {
              "credential": r"(?:ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk_(?:live|test)_[A-Za-z0-9]{12,}|AKIA[0-9A-Z]{16}|-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----)",
              "internal note": r"(?im)^\s*(?:<!--|//|/\*)?\s*(?:INTERNAL ONLY|DEVELOPER NOTE|FIXME|TODO)\s*[:\-]",
          }
          for path in Path("site").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in (".html", ".js", ".css", ".json", ".svg", ".txt", ".md"):
                  continue
              content = path.read_text(encoding="utf-8")
              for label, pattern in patterns.items():
                  if re.search(pattern, content):
                      raise SystemExit(f"{path}: forbidden {label} in public artifact")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload only the public website
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
