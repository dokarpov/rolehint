name: Backend release gate
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .:backend
      CFA_PUBLIC_BETA_LOCK: "1"
      CFA_ALLOW_ANONYMOUS_SELFHOST: "0"
      CFA_SEED_DEMO: "0"
      CFA_RUNTIME_MODE: selfhost
      CFA_DATA_DIR: /tmp/rolehint-ci-data
      TELEGRAM_BOT_TOKEN: 123456:test-only-token
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r backend/requirements.txt pytest
      - run: python -m compileall -q backend/app telegram_bot
      - run: python -m pytest -q tests/test_public_beta.py tests/test_telegram_auth_release.py tests/test_free_discovery_worker.py tests/test_settings_persistence.py tests/test_web_identity.py tests/test_web_cv.py tests/test_web_telegram_login.py tests/test_web_release.py
      - name: Verify at least one real public ATS vacancy
        run: python -m pytest -q tests/test_real_job_sources.py
  deployed-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Smoke-test published backend and site
        run: python scripts/smoke_live_release.py
