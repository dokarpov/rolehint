name: analytics-foundation
on:
  push:
    branches: [feature/job-analytics-foundation]
    paths:
      - 'analytics/**'
      - '.github/workflows/analytics-foundation.yml'
  workflow_dispatch:

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rolehint
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: rolehint_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rolehint -d rolehint_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: rolehint
      PGPASSWORD: test-only-password
      PGDATABASE: rolehint_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply migration twice (idempotence)
        run: |
          psql -v ON_ERROR_STOP=1 -f analytics/sql/001_foundation.sql
          psql -v ON_ERROR_STOP=1 -f analytics/sql/001_foundation.sql
      - name: Exercise funnel transaction
        run: psql -v ON_ERROR_STOP=1 -f analytics/sql/002_smoke.sql
