name: Public site release QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'site/**'
      - 'webapp/**'
      - '.github/workflows/release-qa.yml'
  push:
    branches: [main, feature/value-first-onboarding-20261021]
    paths:
      - 'site/**'
      - 'webapp/**'
      - 'scripts/**'
      - 'site/release-v1.*'
      - 'site/privacy.html'
      - 'site/early-access.js'
      - '.github/workflows/release-qa.yml'
      - 'telegram_miniapp/**'
      - 'site/*.css'
      - 'site/*.js'
      - 'site/qa-release.mjs'
      - 'tests/contrast-qa.mjs'
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Run responsive regression checks against local site
        run: node site/qa-release.mjs
      - name: Test current guest CV/role, privacy, results and auth UI in six viewports
        run: node site/qa-webapp.mjs
      - name: Enforce contrast for marketing and Telegram onboarding
        run: node tests/contrast-qa.mjs
