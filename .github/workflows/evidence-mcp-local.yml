name: RoleHint local evidence MCP QA
on:
  push:
    branches:
      - feature/value-first-onboarding-20261021
    paths:
      - "integrations/evidence_mcp_local/**"
      - "tests/test_evidence_mcp_local.py"
      - ".github/workflows/evidence-mcp-local.yml"
  pull_request:
    paths:
      - "integrations/evidence_mcp_local/**"
      - "tests/test_evidence_mcp_local.py"
      - ".github/workflows/evidence-mcp-local.yml"
  workflow_dispatch:
jobs:
  local-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax and security regressions
        run: |
          python -m py_compile integrations/evidence_mcp_local/inbox.py integrations/evidence_mcp_local/server.py
          python -m unittest discover -s tests -p test_evidence_mcp_local.py -v
      - name: MCP SDK import and tool registration
        run: |
          python -m pip install -r integrations/evidence_mcp_local/requirements.txt
          cd integrations/evidence_mcp_local
          python -c "import server; assert server.mcp is not None"
